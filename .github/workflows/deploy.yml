name: Docker CD - Auto Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Buradaki 'proje-adi' Docker Hub'daki depo adın olsun
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-app-client-1:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Senin bulduğun klasöre git
            cd /home/deploy
            
            # 2. Docker Hub'dan yeni imajı çek
            docker compose pull
            
            # 3. Sadece değişen servisi (imajı) güncelle ve arka planda çalıştır
            docker compose up -d
            
            # 4. Eski ve kullanılmayan imajları temizle (sunucun dolmasın)
            docker image prune -f