name: Deploy Client Only

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Klasor Yapisini Goruntule 
        run: ls -R

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Buradaki ismi 1. adımdaki imaj ismiyle aynı yap
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-app-client-1:latest
          args: |
            VITE_ROOT_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Client
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "--- ADIM 1: Su anki konumu kontrol et ---"
            pwd
            
            echo "--- ADIM 2: 'app' klasorune girmeye calis ---"
            cd /home/deploy/app || cd app || echo "Klasor bulunamadi!"
            
            echo "--- ADIM 3: Klasorun icindeki dosyalari listele ---"
            ls -la
            
            echo "--- ADIM 4: Docker Compose komutunu tam yol belirterek calistir ---"
            # Burada dosya adının docker-compose.yml (veya .yaml) olduğundan emin oluyoruz
            docker compose -f docker-compose.yml pull app-client || docker compose -f docker-compose.yaml pull app-client
            
            echo "--- ADIM 5: Konteyneri guncelle ---"
            docker compose up -d app-client
            
            echo "--- ADIM 6: Temizlik ---"
            docker image prune -f