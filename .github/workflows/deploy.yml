name: Deploy Client Only

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          # Buradaki ismi 1. adımdaki imaj ismiyle aynı yap
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-app-client-1:latest
          build-args: |
            VITE_ROOT_URL=${VITE_ROOT_URL}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Client
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy
            # Sadece client imajını çek
            docker compose pull app-client
            # Sadece client konteynerini güncelle (diğerleri kapanmaz)
            docker compose up -d app-client
            # Eski imajları temizle
            docker image prune -f